<!doctype html>
<html lang="__LANGUAGE__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Codex Usage Analytics</title>
<style>
:root{--bg:#080d14;--panel:#101923;--border:#253343;--text:#eef4fc;--muted:#a3b2c5;--blue:#6095ff;--mint:#49d9b4;--purple:#b083ff;--grid:#22303f}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0%,#142438 0%,transparent 45%),var(--bg);color:var(--text);font:14px/1.6 Inter,"Segoe UI","Microsoft YaHei",sans-serif}main{max-width:1480px;margin:auto;padding:34px 36px 24px}button,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--mint);outline-offset:4px}button:hover{border-color:var(--mint)}.topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px;gap:12px}.brand{font-size:14px;font-weight:700;letter-spacing:2px;display:flex;gap:12px;align-items:center}.logo{display:grid;place-items:center;width:32px;height:32px;border:1px solid var(--mint);border-radius:8px;color:var(--mint);font:20px monospace}.badge{color:var(--mint);font-size:12px;letter-spacing:1px}.badge:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--mint);margin-right:8px}header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:24px}h1{font-size:clamp(28px,3vw,42px);line-height:1.15;letter-spacing:-1.5px;margin:0 0 10px}h2{font-size:16px;line-height:1.4;margin:0;font-weight:600}p{margin:0}.muted,.sub{color:var(--muted)}.sub{font-size:12px;margin-top:4px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.pill,.button{background:#121e2b;border:1px solid var(--border);border-radius:7px;padding:9px 13px;font-size:12px}.button{color:var(--text)}.button.primary{background:var(--mint);border-color:var(--mint);color:#07251d;font-weight:650}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:16px}.card{border:1px solid var(--border);background:linear-gradient(140deg,#121d2a,#0d151e);border-radius:12px;min-width:0}.stat{padding:19px 20px}.stat-top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.symbol{color:var(--mint);font:18px monospace}.value{font-size:32px;line-height:1.35;letter-spacing:-1px;font-weight:650;font-variant-numeric:tabular-nums;margin:9px 0 3px}.stat:nth-child(2) .value{color:var(--blue)}.stat:nth-child(3) .value{color:var(--mint)}.stat:nth-child(4) .value{color:var(--purple)}.grid{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(290px,1fr);gap:16px}.panel{padding:22px}.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:20px}.switch{display:flex;background:#090f17;border:1px solid var(--border);border-radius:7px;padding:3px;flex-shrink:0}.switch button{border:1px solid transparent;background:transparent;border-radius:4px;padding:5px 12px;font-size:12px;color:var(--muted)}.switch button[aria-pressed=true]{background:#233247;color:var(--text)}.legend{display:flex;gap:17px;flex-wrap:wrap;font-size:12px;color:var(--muted)}.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:7px;background:var(--blue)}.dot.cache{background:var(--mint)}.dot.output{background:var(--purple)}.chart-shell{overflow-x:auto;margin-top:12px}.chart{width:100%;height:240px;display:block}.chart text{fill:var(--muted);font:11px "Segoe UI",sans-serif}.chart .column{cursor:pointer;outline:none}.chart .column:hover .hit,.chart .column:focus .hit{fill:#ffffff12;stroke:var(--mint);stroke-width:1}.day-detail{padding-top:14px;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}.day-detail strong{color:var(--text);font-weight:550}.donut-wrap{display:flex;justify-content:center;padding:4px 0 12px}.donut{width:175px;height:175px;border-radius:50%;position:relative;background:var(--border);display:grid;place-items:center}.donut:before{content:"";position:absolute;inset:20px;border-radius:50%;background:#101923}.donut-center{position:relative;text-align:center}.donut-center strong{display:block;font-size:28px;letter-spacing:-.8px}.breakdown{display:grid;gap:11px}.breakdown-row{display:grid;grid-template-columns:1fr auto 45px;gap:10px;align-items:center;font-size:12px}.breakdown-row strong{font-variant-numeric:tabular-nums}.breakdown-row span:last-child{text-align:right;color:var(--muted)}.note{border-top:1px solid var(--border);padding-top:12px;margin-top:15px;color:var(--muted);font-size:12px}.insights{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:16px 0}.insight{padding:19px 22px;border-top:2px solid var(--blue)}.insight:nth-child(2){border-top-color:var(--mint)}.insight:nth-child(3){border-top-color:var(--purple)}.eyebrow{text-transform:uppercase;font-size:11px;letter-spacing:1.5px;color:var(--muted)}.insight .big{font-size:22px;margin:7px 0 3px;font-weight:600;letter-spacing:-.4px}.table-panel{margin-top:16px}.table-wrap{overflow:auto;max-height:450px}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:12px;font-variant-numeric:tabular-nums}th,td{text-align:right;padding:13px 16px;border-bottom:1px solid var(--border)}th{font-weight:500;color:var(--muted);position:sticky;top:0;background:#141f2d}th:first-child,td:first-child{text-align:left}td:nth-child(2){font-weight:600;color:var(--blue)}tbody tr:hover{background:#ffffff04}tr.selected{background:#1c2c3e}tr:last-child td{border:0}.table-panel .panel-head{padding:22px 22px 0}select{border:1px solid var(--border);background:#142030;border-radius:6px;padding:7px}.definitions{margin-top:18px;padding:15px 20px;font-size:12px;color:var(--muted)}summary{cursor:pointer;color:var(--text)}.definitions p{margin-top:8px}footer{display:flex;justify-content:space-between;gap:10px;margin-top:22px;font-size:11px;color:var(--muted)}.empty{padding:18px;border:1px dashed var(--border);border-radius:8px;color:var(--muted);margin-bottom:16px}[hidden]{display:none!important}noscript{display:block;padding:30px;color:var(--text)}
@media(min-width:1500px){.chart{height:265px}.panel{padding:24px}}@media(max-width:1050px){.stats{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:minmax(0,1.7fr) minmax(270px,1fr)}main{padding:25px 22px}.value{font-size:28px}}@media(max-width:760px){main{padding:22px 16px}header{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:repeat(2,1fr);gap:10px}.stats .stat:last-child{grid-column:span 2}.grid{grid-template-columns:1fr}.insights{grid-template-columns:1fr;gap:10px}.panel{padding:18px}.panel-head{flex-wrap:wrap}.topline{margin-bottom:22px}.badge{font-size:10px}.brand{font-size:11px}.stat{padding:16px}.chart{min-width:580px}.breakdown{max-width:420px;margin:auto}.insight .big{font-size:20px}footer{flex-direction:column}.pill{max-width:100%;overflow-wrap:anywhere}}@media print{body{background:white;color:#111;--text:#111;--muted:#444;--border:#ccc}.card{background:white;break-inside:avoid}.toolbar,.switch,.table-controls{display:none}.table-wrap{max-height:none;overflow:visible}main{padding:0}.donut:before{background:white}th{background:#eee}.chart{height:220px}footer{margin-bottom:0}}
</style>
</head>
<body>
<noscript>This dashboard needs JavaScript to display embedded local aggregates. Use --format markdown for a text report.</noscript>
<main>
<div class="topline"><div class="brand"><span class="logo" aria-hidden="true">&gt;_</span> CODEX / ANALYTICS</div><span class="badge" data-i18n="local"></span></div>
<header><div><h1 data-i18n="title"></h1><p class="muted" data-i18n="subtitle"></p></div><div class="toolbar"><span class="pill" id="range"></span><button class="button primary" id="export" data-i18n="export"></button></div></header>
<div class="empty" id="empty" hidden data-i18n="empty"></div>
<section class="stats" aria-label="Overview" id="stats"></section>
<div class="grid">
<section class="card panel"><div class="panel-head"><div><h2 data-i18n="trend"></h2><p class="sub" data-i18n="trendSub"></p></div><div class="switch"><button id="total-mode" aria-pressed="true" data-i18n="total"></button><button id="net-mode" aria-pressed="false" data-i18n="net"></button></div></div><div class="legend" id="legend"></div><div class="chart-shell"><svg class="chart" id="chart" role="group" aria-label="Daily token usage"></svg></div><div class="day-detail" id="day-detail" aria-live="polite"></div></section>
<section class="card panel"><div class="panel-head"><div><h2 data-i18n="composition"></h2><p class="sub" data-i18n="compositionSub"></p></div></div><div class="donut-wrap"><div class="donut" id="donut" role="img"><div class="donut-center"><strong id="donut-value"></strong><span class="sub" data-i18n="components"></span></div></div></div><div class="breakdown" id="breakdown"></div><p class="note" id="composition-note"></p></section>
</div>
<section class="insights" id="insights" aria-label="Highlights"></section>
<section class="card table-panel"><div class="panel-head"><div><h2 data-i18n="daily"></h2><p class="sub" id="daily-sub"></p></div><div class="table-controls"><label for="sort" class="sub" data-i18n="sort"></label> <select id="sort"><option value="date" data-i18n="byDate"></option><option value="total" data-i18n="byTotal"></option></select></div></div><div class="table-wrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div></section>
<details class="card definitions"><summary data-i18n="definitions"></summary><p data-i18n="method"></p><p data-i18n="scope"></p><p id="metadata"></p></details>
<footer><span data-i18n="footer"></span><span>CODEX TOKEN USAGE · LOCAL REPORT</span></footer>
</main>
<script id="report-data" type="application/json">__REPORT_JSON__</script>
<script>
'use strict';
const report=JSON.parse(document.getElementById('report-data').textContent);
const language='__LANGUAGE__';
const translations={
zh:{local:'本地数据 · 离线报告',title:'每一份 Token，都有迹可循。',subtitle:'Codex 用量分析 / 从总量，到每一天的投入。',export:'导出每日 CSV ↓',empty:'该时间范围内没有找到 Token 事件。请检查日期和 Codex 日志目录。',total:'总用量',net:'净用量',sessions:'有用量的会话',calls:'Token 事件数',cacheRate:'缓存命中率',average:'日均 Token',days:'个自然日',active:'个有用量日期',trend:'每日用量趋势',trendSub:'点击柱子查看当天明细 · 包含零用量日期',composition:'Token 构成',compositionSub:'互斥分类，避免重复计数',components:'分类合计',nonCached:'非缓存输入',cached:'缓存输入',output:'输出',input:'输入（含缓存）',reasoning:'推理输出',compositionNote:'缓存包含在输入中；推理包含在输出中，不再叠加。',mismatch:'日志总量与分类合计存在差额：',peak:'峰值日',week:'最忙的一周',cacheInsight:'缓存复用',noData:'暂无数据',daily:'每日明细',dailySub:'每天的用量，含没有用量的日期；悬停查看精确数值。',sort:'排序',byDate:'日期升序',byTotal:'总量降序',date:'日期',definitions:'统计口径与数据来源',method:'总量 = last_token_usage.total_tokens 之和。净用量 = 输入 − 缓存输入 + 输出。缓存命中率 = 缓存输入 ÷ 输入。日均 = 总量 ÷ 所选自然日数（含零用量日期）。',scope:'读取本地 sessions 和 archived_sessions；沿用现有事件去重规则。Token 事件数不是工具调用次数。周统计按周一分组，仅计算选定范围内的事件。报告不推断成功率或工作时长。',footer:'本地生成 · 无外部资源 · 无数据上传',generated:'生成时间',timezone:'统计时区',exact:'精确总量',ofInput:'的输入命中缓存',events:'条事件',selected:'当日',chartNote:'输入 − 缓存 + 输出',cacheFoot:'缓存输入 / 输入',sessionsFoot:'所选范围内去重',eventFoot:'已去重的 token_count',rangeFoot:'范围内日均',totalFoot:'含缓存输入与输出'},
en:{local:'LOCAL DATA · OFFLINE REPORT',title:'Every token tells a story.',subtitle:'Codex usage analytics / Your investment, day by day.',export:'Export daily CSV ↓',empty:'No token events found in this range. Check the dates and Codex log directory.',total:'Total tokens',net:'Net tokens',sessions:'Active sessions',calls:'Token events',cacheRate:'Cache hit rate',average:'Daily average',days:'calendar days',active:'active days',trend:'Usage over time',trendSub:'Select a bar for daily details · Zero days included',composition:'Token breakdown',compositionSub:'Mutually exclusive categories',components:'Component sum',nonCached:'Uncached input',cached:'Cached input',output:'Output',input:'Input (incl. cache)',reasoning:'Reasoning output',compositionNote:'Cache is included in input; reasoning is included in output. Neither is added twice.',mismatch:'Difference between reported total and components: ',peak:'Peak day',week:'Busiest week',cacheInsight:'Cache reuse',noData:'No data',daily:'Daily details',dailySub:'Daily usage, including inactive days; hover for exact counts.',sort:'Sort',byDate:'Date ascending',byTotal:'Total descending',date:'Date',definitions:'Definitions & data source',method:'Total = sum of last_token_usage.total_tokens. Net = input − cached input + output. Cache hit rate = cached input ÷ input. Daily average = total ÷ selected calendar days (including zero days).',scope:'Reads local sessions and archived_sessions using existing event deduplication. Token events are not tool calls. Weeks start on Monday; only events in the requested range count. Success rate and work duration are not inferred.',footer:'Locally generated · No external assets · No uploads',generated:'Generated',timezone:'Timezone',exact:'Exact total',ofInput:'of input served from cache',events:'events',selected:'Selected day',chartNote:'Input − cache + output',cacheFoot:'Cached input / input',sessionsFoot:'Unique within this range',eventFoot:'Deduplicated token_count',rangeFoot:'Across calendar days',totalFoot:'Includes cached input and output'}
};
const t=translations[language],s=report.summary,rows=report.daily;
const $=id=>document.getElementById(id),f=n=>Number(n).toLocaleString(language==='zh'?'zh-CN':'en-US',{maximumFractionDigits:2}),pct=n=>(n*100).toFixed(2)+'%';
const compact=n=>{const a=Math.abs(n);return a>=1e8?f(n/1e8)+' 亿':a>=1e7?f(n/1e7)+' 千万':a>=1e6?f(n/1e6)+' 百万':f(n)};
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t[el.dataset.i18n]);
$('range').textContent=report.start+' — '+report.end+' · '+report.timezone;
$('empty').hidden=s.calls!==0;
const stats=[[t.total,compact(s.total),t.totalFoot,'Σ',f(s.total)],[t.net,compact(s.net_usage),t.chartNote,'↗',f(s.net_usage)],[t.cacheRate,pct(s.cache_hit_rate),t.cacheFoot,'◷',pct(s.cache_hit_rate)],[t.sessions,f(s.sessions),t.sessionsFoot,'#',f(s.sessions)],[t.average,compact(s.daily_average_total),report.days+' '+t.days,'/d',f(s.daily_average_total)]];
$('stats').innerHTML=stats.map(([label,value,note,icon,exact])=>`<article class="card stat"><div class="stat-top"><span>${esc(label)}</span><span class="symbol" aria-hidden="true">${icon}</span></div><div class="value" title="${esc(exact)}">${esc(value)}</div><p class="sub">${esc(note)}</p></article>`).join('');
const components=[{key:'non_cached_input',name:t.nonCached,color:'#6095ff',cls:''},{key:'output',name:t.output,color:'#b083ff',cls:'output'},{key:'cached_input',name:t.cached,color:'#49d9b4',cls:'cache'}];
const componentSum=components.reduce((a,c)=>a+s[c.key],0);
let angle=0;
const stops=components.map(c=>{const begin=angle;angle+=componentSum?s[c.key]/componentSum*360:0;return `${c.color} ${begin}deg ${angle}deg`});
if(componentSum>0&&components.every(c=>s[c.key]>=0))$('donut').style.background=`conic-gradient(${stops.join(',')})`;
$('donut-value').textContent=compact(componentSum);
$('donut').setAttribute('aria-label',components.map(c=>c.name+': '+f(s[c.key])).join(', '));
$('breakdown').innerHTML=components.map(c=>`<div class="breakdown-row"><span><i class="dot ${c.cls}"></i>${esc(c.name)}</span><strong title="${f(s[c.key])}">${compact(s[c.key])}</strong><span>${componentSum?(s[c.key]/componentSum*100).toFixed(1):'0'}%</span></div>`).join('');
$('composition-note').textContent=t.compositionNote+(s.total!==componentSum?' '+t.mismatch+f(s.total-componentSum):'');
const peak=report.peak_day,week=report.peak_week;
const highlights=[[t.peak,peak?peak.date:t.noData,peak?f(peak.summary.total)+' tokens':'—'],[t.cacheInsight,compact(s.cached_input)+' tokens',pct(s.cache_hit_rate)+' '+t.ofInput],[t.week,week?week.start+' → '+week.end:t.noData,week?f(week.summary.total)+' tokens':'—']];
$('insights').innerHTML=highlights.map(([label,value,note])=>`<article class="card insight"><div class="eyebrow">${esc(label)}</div><div class="big">${esc(value)}</div><p class="sub">${esc(note)}</p></article>`).join('');
$('daily-sub').textContent=report.days+' '+t.days+' · '+rows.filter(r=>r.summary.calls>0).length+' '+t.active+' · '+f(s.calls)+' '+t.events;
$('metadata').textContent=t.timezone+': '+report.timezone+' · '+t.generated+': '+report.generated_at;
const fields=[['total',t.total],['input',t.input],['cached_input',t.cached],['output',t.output],['reasoning',t.reasoning],['net_usage',t.net],['calls',t.calls],['sessions',t.sessions]];
$('thead').innerHTML='<tr><th scope="col">'+t.date+'</th>'+fields.map(([,label])=>`<th scope="col">${esc(label)}</th>`).join('')+'</tr>';
let selected=peak?peak.date:rows[0]?.date,mode='total';
function renderTable(){const ordered=[...rows];if($('sort').value==='total')ordered.sort((a,b)=>b.summary.total-a.summary.total);$('tbody').innerHTML=ordered.map(r=>`<tr data-date="${r.date}" class="${r.date===selected?'selected':''}"><td>${r.date}</td>${fields.map(([key])=>`<td title="${f(r.summary[key])}">${['calls','sessions'].includes(key)?f(r.summary[key]):compact(r.summary[key])}</td>`).join('')}</tr>`).join('')}
function selectDay(day){selected=day;const r=rows.find(r=>r.date===day);if(!r)return;$('day-detail').innerHTML=`<strong>${esc(day)}</strong><span>${esc(t.total)} <strong>${f(r.summary.total)}</strong></span><span>${esc(t.net)} <strong>${f(r.summary.net_usage)}</strong></span><span>${f(r.summary.calls)} ${esc(t.events)}</span>`;$('tbody').querySelectorAll('tr').forEach(el=>el.classList.toggle('selected',el.dataset.date===day))}
function renderChart(){const parts=components.filter(c=>mode==='total'||c.key!=='cached_input');$('legend').innerHTML=parts.map(c=>`<span><i class="dot ${c.cls}"></i>${esc(c.name)}</span>`).join('');const W=Math.max(760,rows.length*19+75),H=244,left=90,right=12,top=12,bottom=36,plotH=H-top-bottom,plotW=W-left-right,step=plotW/Math.max(1,rows.length),barW=Math.max(2,step*.64);const max=Math.max(1,...rows.map(r=>Math.max(r.summary[mode==='total'?'total':'net_usage'],parts.reduce((a,c)=>a+Math.max(0,r.summary[c.key]),0))));const svg=$('chart');svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.style.minWidth=Math.min(W,Math.max(580,rows.length*12))+'px';let html='';for(let i=0;i<=4;i++){const y=top+plotH-i*plotH/4;html+=`<line x1="${left}" y1="${y}" x2="${W-right}" y2="${y}" stroke="#22303f"/><text x="${left-9}" y="${y+4}" text-anchor="end">${compact(max*i/4)}</text>`}rows.forEach((r,i)=>{const x=left+i*step+step/2;let y=top+plotH;const label=r.date+', '+t.total+': '+f(r.summary.total)+', '+t.net+': '+f(r.summary.net_usage);html+=`<g class="column" data-date="${r.date}" tabindex="0" role="button" aria-label="${esc(label)}"><title>${esc(label)}\n${parts.map(c=>c.name+': '+f(r.summary[c.key])).join('\n')}</title><rect class="hit" x="${x-step/2}" y="${top}" width="${step}" height="${plotH}" fill="transparent"/>`;parts.forEach(c=>{const h=Math.max(0,r.summary[c.key])/max*plotH;y-=h;html+=`<rect x="${x-barW/2}" y="${y}" width="${barW}" height="${h}" fill="${c.color}" pointer-events="none"/>`});html+='</g>';if(i%Math.max(1,Math.ceil(rows.length/9))===0||i===rows.length-1)html+=`<text x="${x}" y="${H-10}" text-anchor="middle">${r.date.slice(5)}</text>`});if(mode==='total'){
  const points=rows.map((r,i)=>`${left+i*step+step/2},${top+plotH-r.summary.total/max*plotH}`).join(' ');
  html+=`<polyline points="${points}" fill="none" stroke="#eef4fc" stroke-width="1.5" stroke-dasharray="3 3" pointer-events="none"/>`;
  $('legend').innerHTML+=`<span><i class="dot" style="background:#eef4fc"></i>${language==='zh'?'日志总量':'Reported total'}</span>`;
}
svg.innerHTML=html;svg.querySelectorAll('.column').forEach(el=>{el.addEventListener('click',()=>selectDay(el.dataset.date));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectDay(el.dataset.date)}})})}
for(const key of ['total','net'])$(key+'-mode').addEventListener('click',()=>{mode=key;for(const k of ['total','net'])$(k+'-mode').setAttribute('aria-pressed',String(k===mode));renderChart()});
$('sort').addEventListener('change',renderTable);
$('export').addEventListener('click',()=>{const csv=[['date',...fields.map(([key])=>key)].join(','),...rows.map(r=>[r.date,...fields.map(([key])=>r.summary[key])].join(','))].join('\r\n');const url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=`codex-daily-${report.start}-${report.end}.csv`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)});
renderTable();renderChart();selectDay(selected);
</script>
</body>
</html>
